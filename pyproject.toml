[project]
name = "bill-checkup"
version = "0.1.0"
description = "导入微信/支付宝账单，自动分类，可视化消费"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.39.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
# 让测试能 import 项目根目录下的 core 等模块
pythonpath = ["."]
