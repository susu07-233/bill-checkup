# Streamlit 项目配置
[browser]
# 不向 Streamlit 发送使用统计（项目主打隐私）
gatherUsageStats = false

[client]
# 右上角只留最少的菜单（去掉「Deploy」等开发用按钮）
toolbarMode = "minimal"

[server]
# 代码文件改了就自动重新运行，不再弹出英文的「File change. Rerun / Always rerun」提示
runOnSave = true

# ---------- 主题：奶油白 + 鼠尾草绿的「生活账本」风格（苏宇晨 U15） ----------
# 页面暖白、侧栏浅灰绿、卡片纯白（卡片的白底和阴影在 styles.py 里）、主按钮深绿、杏橙只做少量点缀。
# 图表里「必要 = 绿、弹性 = 杏橙」已用 dataviz 校验脚本检查过色盲可分辨；
# 绿 / 橙文字单独用更深的颜色（greenTextColor / orangeTextColor），保证白底上看得清。
[theme]
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = false
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"     # 数字卡片的大数字小一点，窄屏时不容易被截断
metricValueFontWeight = 600
linkUnderline = false
paddingTop = "3rem"

[theme.light]
primaryColor = "#2f5d46"
backgroundColor = "#faf8f3"
secondaryBackgroundColor = "#f1efe7"
textColor = "#1d2621"
linkColor = "#2f5d46"
borderColor = "#e6e2d6"
# 提示框（st.info）用的「蓝」换成低饱和的灰青色，不跳出整体的绿 / 米色调
blueColor = "#3d7a80"
blueTextColor = "#2d5a5e"
blueBackgroundColor = "#e5eeec"
greenColor = "#28855c"
greenTextColor = "#1f6b49"
greenBackgroundColor = "#e3efe7"
orangeColor = "#e5853f"
orangeTextColor = "#a8541a"
orangeBackgroundColor = "#fbeadb"
grayTextColor = "#5f655f"
redColor = "#c4433a"
chartCategoricalColors = ["#28855c", "#e5853f", "#3f7fa6", "#c9a227", "#b8678f", "#6d8b3a", "#7a6bb8", "#c4433a"]
dataframeHeaderBackgroundColor = "#f3f1ea"
dataframeBorderColor = "#e6e2d6"

[theme.light.sidebar]
backgroundColor = "#eaefe8"
secondaryBackgroundColor = "#dfe6dc"
borderColor = "#d6ddd2"

[theme.dark]
primaryColor = "#3d8a63"
backgroundColor = "#171a17"
secondaryBackgroundColor = "#222622"
textColor = "#eef0ea"
linkColor = "#7cc29c"
borderColor = "#343a34"
blueColor = "#5a9ca2"
blueTextColor = "#9ccbd0"
blueBackgroundColor = "#1d2e30"
greenColor = "#3a9c70"
greenTextColor = "#7cc29c"
greenBackgroundColor = "#1f3328"
orangeColor = "#d26f30"
orangeTextColor = "#eea06a"
orangeBackgroundColor = "#3a2718"
grayTextColor = "#a6aba4"
redColor = "#e0675e"
chartCategoricalColors = ["#3a9c70", "#d26f30", "#5a9cc4", "#c9a227", "#d07ea6", "#8aab52", "#9a8ce0", "#e0675e"]
dataframeHeaderBackgroundColor = "#222622"
dataframeBorderColor = "#343a34"

[theme.dark.sidebar]
backgroundColor = "#131613"
secondaryBackgroundColor = "#222622"
