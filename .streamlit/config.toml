# Streamlit 项目配置
[browser]
# 不向 Streamlit 发送使用统计（项目主打隐私）
gatherUsageStats = false

[client]
# 右上角只留最少的菜单（去掉「Deploy」等开发用按钮）
toolbarMode = "minimal"

[server]
# 代码文件改了就自动重新运行，不再弹出英文的「File change. Rerun / Always rerun」提示
runOnSave = true

# ---------- 主题 ----------
# 主色用「必要」的蓝色，和图表一致；支持浅色 / 深色两种模式（右上角菜单里切换）。
# 颜色取自 dataviz 规范的默认配色，图表里的蓝 / 橙已用校验脚本检查过色盲可分辨。
[theme]
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"     # 数字卡片的大数字小一点，窄屏时不容易被截断
metricValueFontWeight = 600
linkUnderline = false

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#1f2328"
linkColor = "#2a78d6"
borderColor = "#e3e6eb"
blueColor = "#2a78d6"
orangeColor = "#eb6834"
redColor = "#d03b3b"
greenColor = "#0ca30c"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
dataframeHeaderBackgroundColor = "#f4f6f9"
dataframeBorderColor = "#e3e6eb"

[theme.light.sidebar]
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#e9edf2"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242423"
textColor = "#f0efec"
linkColor = "#6da7ec"
borderColor = "#383835"
blueColor = "#3987e5"
orangeColor = "#d95926"
redColor = "#e66767"
greenColor = "#0ca30c"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
dataframeHeaderBackgroundColor = "#242423"
dataframeBorderColor = "#383835"

[theme.dark.sidebar]
backgroundColor = "#141413"
secondaryBackgroundColor = "#242423"
